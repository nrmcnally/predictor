# Fly.io config — see DEPLOY.md for the full walkthrough.
# App names are global on Fly; if "fightiq" is taken, `fly launch` will let you
# rename (or edit this line).
app = "fightiq"
primary_region = "ord"  # pick a region near you: ord/den/iad/lax...

[http_service]
  internal_port = 8000
  force_https = true
  # The machine sleeps when nobody's using it (you stop paying for CPU) and wakes
  # on the next request — expect a few seconds of cold start, fine for friends-scale.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  # pandas + sklearn + the method models need headroom; 512MB risks OOM.
  memory = "1gb"

[mounts]
  source = "fightiq_data"
  destination = "/data"
